.body{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:0 0 9px 9px}

.vr #hint{display:none}

<input type="file" id="f" hidden>
<script>

/* STL */

 if(84+c*50===buf.byteLength){p=new Float32Array(c*9);for(let i=0;i<c;i++){const o=84+i*50+12;for(let k=0;k<9;k++)p[i*9+k]=dv.getFloat32(o+k*4,true)}}

/* PDF (pdf.js, funciona en Android) */

  const d=await pdfjsLib.getDocument({data:new Uint8Array(w.buf)}).promise;
  for(let i=1;i<=Math.min(d.numPages,20);i++){if(!W.includes(w))return;

 }catch(e){a.textContent='No se pudo abrir el PDF (¿sin internet para cargar pdf.js?)';a.style.color='#fff'}}

/* ventanas */
function content(w,i){let c;const k=w.kind;

 else if(k==='video'){c=document.createElement('video');c.src=w.src;c.loop=true;c.playsInline=true;c.muted=i>0;c.controls=i==0;(w.v=w.v||[])[i]=c;c.play().catch(()=>{})}

function addWin(kind,name,src,geo,buf){

 W.push(w);
 E.forEach(eye=>{const el=document.createElement('div');el.className='win tl';el.dataset.id=k;
  const bt=BT.map(b=>btn(...b)).join('');
  el.innerHTML='<div class="bar"><b></b>'+btn('T','⋯','Controles')+btn('X','✕','Cerrar')+'</div><div class="tools">'+bt+'</div><div class="body"></div><div class="rz"></div>';
  el.querySelector('b').textContent=(k+1)+' · '+name;el.querySelector('.body').append(content(w,eye===E[0]?0:1));
  eye.st.append(el);w.els.push(el)});

function place(w){w.z=Math.max(-2*P,Math.min(.7*P,w.z));w.o=Math.max(.12,Math.min(1,w.o));

  s.transform=`translate3d(${w.x}px,${w.y}px,${w.z}px) translate(-50%,-50%) rotateY(${a+w.ry}deg)`;
  if(w.kind==='doc'||w.kind==='web'){const b=el.querySelector('.body'),q=b.firstChild,bw=b.clientWidth,bh=b.clientHeight;if(bw&&bh){const L=w.kind==='web'?1024:720,c=bw/L;q.style.cssText+=`;width:${L}px;height:${bh/c}px;transform-origin:0 0;transform:scale(${c})`}}})}

 if(a==='L')w.x-=s;else if(a==='R')w.x+=s;else if(a==='U')w.y-=s;else if(a==='D')w.y+=s;
 else if(a==='N')w.z+=s;else if(a==='F')w.z-=s;
 else if(a==='+'){w.w*=1.15;w.h*=1.15}else if(a==='-'){w.w=Math.max(.3*P,w.w/1.15);w.h=Math.max(.2*P,w.h/1.15)}

const NW={uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100};
function voice(raw){
 const t=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(new RegExp('\\b('+Object.keys(NW).join('|')+')\\b','g'),m=>NW[m]),
  has=r=>r.test(t),num=(t.replace(/ventana \d+/g,'').match(/(\d+)/)||[])[1],rep=has(/mucho|bastante/)?3:1;let w=tgt();
 const m=t.match(/ventana (\d+)/);
 if(m){const x=W.find(q=>q.id+1==+m[1]);if(!x)return say('No existe la ventana '+m[1]);setSel(x);w=x;say('✔ ventana '+m[1]);if(!has(/cierr|cerrar|elimin|quita|agrand|aument|ampli|reduc|disminu|achic|encog|mueve|mover|rota|gira|transpar|opac|centra|derecha|izquierda|arriba|abajo|acerca|aleja/))return}
 if(has(/(cierra|cerrar|elimina|quita)\w* (todas|todo)/)){[...W].forEach(q=>act(q,'X'));return say('✔ todas cerradas')}
 if(!w)return say('No hay ventanas abiertas');
 const dir=has(/derecha/)?'R':has(/izquierda/)?'L':has(/arriba|sube|subir/)?'U':has(/abajo|baja|bajar/)?'D':has(/adelante|acerca|cerca/)?'N':has(/atras|aleja|lejos/)?'F':null,
  go=(a,n=rep)=>{for(let i=0;i<n;i++)act(w,a)};

 if(has(/rota|gira|giro/)){w.ry+=(dir==='L'?-1:1)*(num?+num:15)*rep;place(w);return say('✔ rotada')}
 if(has(/agrand|aument|ampli|mas grande|mayor/)){go('+');return say('✔ más grande')}
 if(has(/reduc|disminu|achic|encog|mas pequen|menor/)){go('-');return say('✔ más pequeña')}

 if(has(/pagina|siguiente|anterior/)){go(has(/anterior|sube|arriba/)?'PU':'PD',1);return say('✔ página')}

function toggleVoz(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

 vOn=true;document.body.classList.add('voz');try{rec.start();say('🎤 Escuchando…')}catch(e){}}

/* dock */
const DK=[['video','Video'],['image','Imagen'],['stl','Modelo STL'],['pdf','PDF'],['html','HTML'],['web','Web'],['cam','Cámara AR'],['vr','Modo VR'],['voz','Voz'],['any','Abrir…'],['fov+','Campo +'],['fov-','Campo −'],['ipd+','Fusión +'],['ipd-','Fusión −'],['ln+','Lentes +'],['ln-','Lentes −']];

const sv=()=>{try{localStorage.vr=JSON.stringify(V)}catch(e){}},CAL={'fov+':()=>V.k-=.04,'fov-':()=>V.k+=.04,'ipd+':()=>V.i+=.002,'ipd-':()=>V.i-=.002,'ln+':()=>V.l+=4,'ln-':()=>V.l-=4};

const isH=x=>/\.x?html?$/i.test(x.name)||x.type==='text/html'||x.type==='application/xhtml+xml';

 ({video:()=>pick('video/*'),image:()=>pick('image/*'),stl:()=>pick('.stl,model/stl,application/sla,application/octet-stream'),pdf:()=>pick('.pdf,application/pdf'),html:()=>pick('.html,.htm,.xhtml,text/html,application/xhtml+xml,.css,.js,.json,.svg,image/*,font/*'),web,cam,vr:toggleVR,voz:toggleVoz,any:()=>pick('*/*')})[b.dataset.d]()});

 t.click()}

const Y=new THREE.Vector3(0,1,0),F0=new THREE.Vector3();
